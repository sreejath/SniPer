<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>S.N.I.P.E.R — Personal AI Interface</title>
<meta name="description" content="SniPer — a retro JARVIS-style voice assistant that runs entirely in your browser." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23000814%22 stroke=%22%2300eaff%22 stroke-width=%226%22/><circle cx=%2250%22 cy=%2250%22 r=%2220%22 fill=%22%2300eaff%22/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="scanlines" aria-hidden="true"></div>
<div class="grid-overlay" aria-hidden="true"></div>

<div class="app">

  <header class="hud-header">
    <div class="title-block">
      <h1>S.N.I.P.E.R</h1>
      <p class="subtitle">Smart Neural Interactive Personal Educational Responder</p>
    </div>
    <div class="status-block">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">STANDBY</span>
    </div>
  </header>

  <main class="main-grid">

    <section class="core-panel" aria-label="AI Core Visualizer">
      <div class="core" id="core">
        <div class="ring ring-outer"></div>
        <div class="ring ring-mid"></div>
        <div class="ring ring-inner"></div>
        <div class="core-center">
          <span id="clockDisplay">--:--:--</span>
        </div>
      </div>
      <div class="bars" id="bars" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <p class="date-line" id="dateDisplay">Loading date...</p>
    </section>

    <section class="console-panel" aria-label="Conversation Log">
      <div class="console-header">
        <span>&gt; TRANSMISSION LOG</span>
        <button id="clearBtn" class="ghost-btn" type="button">CLEAR</button>
      </div>
      <div class="console-log" id="log" role="log" aria-live="polite"></div>

      <form class="input-row" id="inputForm" autocomplete="off">
        <button type="button" id="micBtn" class="mic-btn" title="Speak to SniPer" aria-label="Start voice input">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
            <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/>
            <path d="M19 11a7 7 0 0 1-14 0H3a9 9 0 0 0 8 8.94V22h2v-2.06A9 9 0 0 0 21 11h-2z"/>
          </svg>
        </button>
        <input type="text" id="textInput" placeholder="Type a command, sir…" aria-label="Type your question" />
        <button type="submit" class="send-btn">SEND</button>
      </form>

      <div class="quick-row" id="quickRow">
        <button type="button" class="chip" data-q="What time is it?">Time?</button>
        <button type="button" class="chip" data-q="What day is it today?">Day?</button>
        <button type="button" class="chip" data-q="What is the current weather?">Weather?</button>
        <button type="button" class="chip" data-q="Teach me the solar system">Teach me…</button>
      </div>
    </section>

  </main>

  <footer class="hud-footer">
    <span>SniPer v1.0 — runs locally in your browser. Voice input needs Chrome/Edge on desktop or Android.</span>
  </footer>

</div>

<script src="js/knowledge.js"></script>
<script src="js/app.js"></script>
</body>
</html>
